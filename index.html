  <script>
    const stages = [
      {
        name: ['プロフィール・広告 → DM', 'Profile / ad → DM'],
        question: ['プロフィールや広告を見た人は、次に何をすればいいか分かりますか？', 'Do people know what to do after seeing your profile or ad?'],
        help: ['「DMで〇〇と送ってね」など、次の一歩を案内していますか？', 'For example, do you tell them what to send you in a DM?'],
        options: [['送る言葉と、送ると何が分かるかを書いている', 'I explain what to send and what they will get'], ['DMの案内はあるけど、内容はあいまい', 'I mention DMs, but the next step is vague'], ['DMしてもらう案内がない', 'I do not invite them to send a DM']],
        explanation: ['興味を持った人が、次に何をすればいいか迷うかもしれません。DMで送る言葉と、送ると何が分かるかを一つにしぼって伝えましょう。', 'Interested people may not know what to do next. Give them one clear word to DM and explain what they will get.'],
        action: ['「相談したい方は『相談』とDMしてください」と書いてみましょう。', 'Try: “DM me CONSULT if you would like to talk.”']
      },
      {
        name: ['DM → 返信', 'DM → reply'],
        question: ['相談のDMが来たら、いつ返していますか？', 'When someone sends an inquiry, when do you reply?'],

        options: [['その日のうちに返す。返せない時も一言伝える', 'That day, with a short update if I need more time'], ['翌日以降になることが多い', 'Often the next day or later'], ['見落としたり、返せないままになったりする', 'I sometimes miss messages or leave them unanswered']],

      },
      {
        name: ['DM → LINE', 'DM → LINE'],
        question: ['DMからLINEに進んでもらう時、理由を伝えていますか？', 'When you invite someone from DMs to LINE, do you explain why?'],

      },
      {
        name: ['LINE → その後の連絡', 'LINE → follow-up'],
        question: ['LINEに登録した人へ、その後も案内していますか？', 'After someone adds your LINE, do you follow up?'],
        help: ['登録したまま、何も届かない人はいませんか？', 'Does anyone add you and then hear nothing more?'],
        options: [['最初の案内と、その後に送る内容を決めている', 'I have a welcome message and a follow-up plan'], ['最初のあいさつだけを送る', 'I send only a welcome message'], ['気づいた時だけ送る、または何も送らない', 'I send messages only when I remember, or not at all']],

      {

        messageLabel: 'DMに貼り付ける文', message: '診断を受けました。「{stage}」を見直したいです。私のお店の場合、どうつなげればよいか相談したいです。',
        healthyMessage: '診断を受けました。DM・LINE・予約の流れを、お店に合わせて見直したいです。',
        unknownMessage: '診断を受けました。今のお店のDM・LINE・予約の流れを整理したいです。',
        copy: '文をコピー', copied: 'コピーしました。InstagramのDMに貼り付けてください。',
        copyFallback: '文を選択しました。長押し、またはコピー操作でコピーしてください。',
        details: '7つの回答と、結果の見方', statuses: ['案内できている', '少し見直したい', '優先して見直したい', '判定しない'],
        method: 'これは自己診断です。実際にお客様が離れた場所や、売上・予約への影響を測った結果ではありません。回答を0〜2点の見直し優先度として比べ、最も高い項目を表示します。同点なら流れの早い順。未使用・不明は除外し、すべて0点なら大きな見直しポイントなしと表示します。',
        restart: 'もう一度チェックする',
      },
      en: {
        title: 'Where are your customers dropping off? | yuuyamarketing', eyebrow: 'FREE BOOKING FLOW CHECK · 7 QUESTIONS',
        hero: 'Interested customers.<br><em>Where do they disappear?</em>',
        intro: 'They seem interested, but never book.<br>Use seven simple questions to find a place to improve.',
        start: 'Check my flow', startNote: 'No signup. No name or contact details required.',
        routeTitle: 'Check your customer’s next step', routeHint: 'A stopping point?',
        promise: 'No blame, no judgment. Just one clear place to start improving your customer’s next step.',
        footer: 'Answers stay on this page. They are not saved or sent.',
        progress: 'Question', choose: 'Choose the one answer closest to what you do today.',
        skip: 'Not applicable / I am not sure yet', back: 'Back', next: 'Next', finish: 'See my result',
        resultLabel: 'A place to improve, based on your answers', resultTitle: 'Start by reviewing',
        healthyTitle: 'No major improvement point stood out',
        healthyText: 'Your answers suggest that you guide customers through the steps you use. Check real inquiry, booking and attendance numbers to see whether those steps connect in practice.',
        unknownTitle: 'Start by mapping your current flow',
        unknownText: 'Every answer was not applicable or unknown, so we cannot rank a priority. Trace one recent customer from their first contact to their booking.',
        first: 'ONE FIRST STEP', healthyAction: 'Trace one recent inquiry from the first DM through booking and attendance.',
        unknownAction: 'Once you know which steps you use, take the check again.',
        tie: 'Other steps have the same priority: ', tieEnd: '. We show the earliest one in the customer journey first.',
        skipped: 'Not applicable / unknown answers are excluded from the result.',
        flowTitle: 'An example: KNCT University’s flow',
        flowIntro: 'Two entry paths join at LINE, then share one booking and sales process.',
        profile: 'Profile A', application: 'Application funnel', line: 'LINE', booking: 'Booking / consultation', sale: 'Offer / sale',
        flowCaption: 'A simplified flow illustration, not evidence of revenue or booking increases.',
        ctaTitle: 'How could this work for your business?',
        ctaText: 'Talk to yuuyamarketing about connecting your DMs, LINE and follow-up. Send “quiz” and your result on Instagram.',
        cta: 'Open Instagram to send a DM ↗',
        ctaNote: 'Opens @yuuyamarketing’s profile. You send the DM yourself.',
        messageLabel: 'A message to paste into your DM',
        message: 'I took the quiz. I want to improve “{stage}”. Can we discuss how to connect the flow for my business?',
        healthyMessage: 'I took the quiz. I would like to review my business’s DM, LINE and booking flow.',
        unknownMessage: 'I took the quiz. I would like help mapping my business’s DM, LINE and booking flow.',
        copy: 'Copy message', copied: 'Copied. Paste it into your Instagram DM.',
        copyFallback: 'Message selected. Long-press or use your copy command to copy it.',
        details: 'Your 7 answers and how the result works', statuses: ['Clear next step', 'Some room to improve', 'Review first', 'Not assessed'],
        method: 'This is a self-check, not a measurement of customer drop-off or revenue and booking impact. Answers are assigned an improvement priority from 0 to 2. The highest priority is shown first; ties follow journey order. Unknown or unused steps are excluded. If every assessed step scores 0, no major improvement point is shown.',
        restart: 'Take the check again',
      }
    };
    const app = document.getElementById('app');
    let language = 'ja';
    let screen = 'landing';
    let questionIndex = 0;
    let answers = Array(7).fill(undefined);
    const text = pair => pair[language === 'ja' ? 0 : 1];
    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);

    function calculateResult(values) {
      const assessed = values.map((score, index) => ({ score, index })).filter(item => Number.isInteger(item.score) && item.score >= 0 && item.score <= 2);
      if (assessed.length === 0) return { type: 'unknown', indices: [] };
      const highest = Math.max(...assessed.map(item => item.score));
      if (highest === 0) return { type: 'healthy', indices: [] };
      return { type: 'priority', indices: assessed.filter(item => item.score === highest).map(item => item.index) };
    }

    function render(focus = true) {
      const labels = copy[language];
      document.documentElement.lang = language;
      document.title = labels.title;
      document.getElementById('footer-note').textContent = labels.footer;
      document.querySelectorAll('[data-language]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.language === language)));
      if (screen === 'landing') renderLanding(labels);
      if (screen === 'question') renderQuestion(labels);
      if (screen === 'result') renderResult(labels);
      if (focus) {
        app.querySelector('h1, h2')?.focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    }

    function renderLanding(labels) {
      app.innerHTML = `<div class="landing"><section><p class="eyebrow">${labels.eyebrow}</p><h1 tabindex="-1">${labels.hero}</h1><p class="lede">${labels.intro}</p><button class="primary" type="button" data-action="start">${labels.start}<span aria-hidden="true">→</span></button><p class="fineprint">${labels.startNote}</p></section><aside class="route-preview" aria-label="${labels.routeTitle}"><p>${labels.routeTitle}</p>${stages.map((stage, index) => `<div class="route-row ${index === 4 ? 'highlight' : ''}"><span>${String(index + 1).padStart(2, '0')}</span><strong>${escapeHtml(text(stage.name))}</strong>${index === 4 ? `<i>${labels.routeHint}</i>` : ''}</div>`).join('')}</aside></div><p class="promise">${labels.promise}</p>`;
    }

    function renderQuestion(labels) {
      const stage = stages[questionIndex];
      app.innerHTML = `<section class="quiz-wrap"><div class="progress-head"><span>${labels.progress} ${questionIndex + 1} / 7</span><span>${escapeHtml(text(stage.name))}</span></div><progress value="${questionIndex + 1}" max="7" aria-label="${labels.progress} ${questionIndex + 1} / 7"></progress><p class="question-stage">${String(questionIndex + 1).padStart(2, '0')} / ${escapeHtml(text(stage.name))}</p><h2 id="question-title" tabindex="-1">${escapeHtml(text(stage.question))}</h2><p class="question-help" id="question-help">${escapeHtml(text(stage.help))}</p><form id="question-form"><fieldset aria-labelledby="question-title" aria-describedby="question-help"><legend class="sr-only">${labels.choose}</legend>${stage.options.map((option, index) => `<label class="option"><input type="radio" name="answer" value="${index}" ${answers[questionIndex] === index ? 'checked' : ''} required><span>${escapeHtml(text(option))}</span></label>`).join('')}<label class="option skip"><input type="radio" name="answer" value="skip" ${answers[questionIndex] === null ? 'checked' : ''} required><span>${labels.skip}</span></label></fieldset><div class="quiz-actions"><button type="button" class="quiet" data-action="back">← ${labels.back}</button><button type="submit" class="primary" ${answers[questionIndex] === undefined ? 'disabled' : ''}>${questionIndex === 6 ? labels.finish : labels.next} <span aria-hidden="true">→</span></button></div></form></section>`;
    }

    function renderResult(labels) {
      const result = calculateResult(answers);
      const stage = result.type === 'priority' ? stages[result.indices[0]] : null;
      const headline = stage ? `${labels.resultTitle}<br><em>${escapeHtml(text(stage.name))}</em>` : result.type === 'healthy' ? labels.healthyTitle : labels.unknownTitle;
      const explanation = stage ? text(stage.explanation) : result.type === 'healthy' ? labels.healthyText : labels.unknownText;
      const action = stage ? text(stage.action) : result.type === 'healthy' ? labels.healthyAction : labels.unknownAction;
      const message = stage ? labels.message.replace('{stage}', text(stage.name)) : result.type === 'healthy' ? labels.healthyMessage : labels.unknownMessage;
      const ties = result.indices.slice(1).map(index => text(stages[index].name)).join(language === 'ja' ? '、' : ', ');
      app.innerHTML = `<section class="result"><div class="result-head"><p class="eyebrow">${labels.resultLabel}</p><h1 tabindex="-1">${headline}</h1><p class="result-explanation">${escapeHtml(explanation)}</p>${ties ? `<p class="tie-note">${labels.tie}${escapeHtml(ties)}${labels.tieEnd}</p>` : ''}${answers.includes(null) ? `<p class="fineprint">${labels.skipped}</p>` : ''}<div class="first-step"><span>${labels.first}</span><p>${escapeHtml(action)}</p></div></div><section class="flow-section" aria-labelledby="flow-title"><h2 id="flow-title">${labels.flowTitle}</h2><p>${labels.flowIntro}</p><div class="flow" role="img" aria-label="${escapeHtml(`${labels.profile} / ${labels.application} → ${labels.line} → ${labels.booking} → ${labels.sale}`)}"><div class="flow-inputs"><div class="flow-node">${labels.profile}</div><div class="flow-node">${labels.application}</div></div><span class="arrow" aria-hidden="true">→</span><div class="flow-node line">${labels.line}</div><span class="arrow" aria-hidden="true">→</span><div class="flow-node">${labels.booking}</div><span class="arrow" aria-hidden="true">→</span><div class="flow-node">${labels.sale}</div></div><p class="flow-caption">${labels.flowCaption}</p></section><section class="cta" aria-labelledby="cta-title"><h2 id="cta-title">${labels.ctaTitle}</h2><p>${labels.ctaText}</p><a class="primary" href="https://www.instagram.com/yuuyamarketing/" target="_blank" rel="noopener noreferrer">${labels.cta}</a><p class="fineprint">${labels.ctaNote}</p><label for="dm-message" class="message-label">${labels.messageLabel}</label><textarea id="dm-message" readonly>${escapeHtml(message)}</textarea><div class="copy-actions"><button type="button" class="secondary" data-action="copy">${labels.copy}</button><span id="copy-status" role="status"></span></div></section><details><summary>${labels.details}</summary><ul class="checks">${stages.map((item, index) => `<li><span>${escapeHtml(text(item.name))}</span><strong class="${answers[index] === 2 ? 'needs-work' : ''}">${labels.statuses[answers[index] === null || answers[index] === undefined ? 3 : answers[index]]}</strong></li>`).join('')}</ul><p class="method">${labels.method}</p></details><button type="button" class="quiet restart" data-action="restart">${labels.restart}</button></section>`;
    }

    document.querySelector('.language').addEventListener('click', event => {
      const button = event.target.closest('[data-language]');
      if (!button) return;
      language = button.dataset.language;
      render();
    });
    app.addEventListener('change', event => {
      if (event.target.name !== 'answer') return;
      answers[questionIndex] = event.target.value === 'skip' ? null : Number(event.target.value);
      app.querySelector('[type="submit"]').disabled = false;
    });
    app.addEventListener('submit', event => {
      event.preventDefault();
      if (answers[questionIndex] === undefined) return;
      if (questionIndex < 6) questionIndex += 1;
      else screen = 'result';
      render();
    });
    app.addEventListener('click', async event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'start' || action === 'restart') {
        answers = Array(7).fill(undefined);
        questionIndex = 0;
        screen = 'question';
      } else if (action === 'back') {
        if (questionIndex > 0) questionIndex -= 1;
        else screen = 'landing';
      } else if (action === 'copy') {
        const field = document.getElementById('dm-message');
        try {
          await navigator.clipboard.writeText(field.value);
          document.getElementById('copy-status').textContent = copy[language].copied;
        } catch {
          field.focus();
          field.select();
          field.setSelectionRange(0, field.value.length);
          document.getElementById('copy-status').textContent = copy[language].copyFallback;
        }
        return;
      }
      render();
    });
    render(false);
  </script>
</body>
</html>
